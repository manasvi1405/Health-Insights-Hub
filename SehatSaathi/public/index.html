<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>SehatSaathi - Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="center-screen">
    <div class="brand-block">
      <div class="logo-circle">S</div>
      <h1>SehatSaathi</h1>
      <p>Your digital health companion</p>
    </div>

    <!-- Phone step -->
    <div id="phone-step" class="card" style="width:100%; max-width:340px;">
      <div class="input-group">
        <label for="phone">Mobile Number</label>
        <div class="phone-row">
          <span class="prefix">+91</span>
          <input id="phone" class="input" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter 10-digit number" />
        </div>
      </div>
      <button id="send-otp-btn" class="btn btn-lg">Send OTP</button>
    </div>

    <!-- OTP step -->
    <div id="otp-step" class="card hidden" style="width:100%; max-width:340px;">
      <div class="input-group">
        <label for="otp">Enter 6-digit OTP</label>
        <input id="otp" class="input" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center; letter-spacing:8px; font-size:22px;" />
      </div>
      <div class="input-group" id="name-input-group">
        <label for="name">Your Name (first time only)</label>
        <input id="name" class="input" type="text" placeholder="e.g. Ramesh Kumar" />
      </div>
      <button id="verify-btn" class="btn btn-lg">Verify &amp; Login</button>
      <button id="back-btn" class="btn btn-ghost mt-2">← Change number</button>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
