kind = "web"
previewPath = "/"
title = "SehatSaathi AI"
version = "1.0.0"
id = "artifacts/sehat-saathi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22422

[services.development]
run = "pnpm --filter @workspace/sehat-saathi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sehat-saathi", "run", "build" ]
publicDir = "artifacts/sehat-saathi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22422"
BASE_PATH = "/"
